# Local stack: PostgreSQL, Redis, Django API, Celery worker, Celery Beat and the
# React frontend. DJANGO_ENV in .env picks the settings module and the image
# targets (development | production). Run `make up` or `docker compose up --build`.

x-backend-env: &backend-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0

x-backend: &backend
  build:
    context: ./backend
    target: ${DJANGO_ENV:-development}
  env_file: .env
  environment:
    <<: *backend-env
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  celery-worker:
    <<: *backend
    command: celery -A config worker --loglevel=info
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"

  celery-beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"

  frontend:
    build:
      context: ./frontend
      target: ${DJANGO_ENV:-development}
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules instead of the host's.
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
